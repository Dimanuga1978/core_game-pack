<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ожидание начала игры</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0a0e14;color:#eef3fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
main{max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.seat{font-size:44px;font-weight:700;width:88px;height:88px;border:2px solid #2c8a76;border-radius:16px;display:flex;align-items:center;justify-content:center;background:#111823}
h1{font-size:18px;margin:0;font-weight:600}
p{color:#9db3c4;font-size:14px;margin:0;line-height:1.5}
.spinner{width:22px;height:22px;border:3px solid #2a3947;border-top-color:#2c8a76;border-radius:50%;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#f3b4bb;background:#2a1418;border:1px solid #7a2a33;border-radius:8px;padding:12px 16px;font-size:13px}
.count{font-size:15px;font-weight:600;color:#4fd1a5}
</style>
</head>
<body>
<main>
  <div class="seat" id="seat-label">?</div>
  <h1 id="status-title">Ждём начала игры…</h1>
  <p class="count" id="count-hint">Подключилось: 1 из 4</p>
  <p id="status-hint">Организатор ещё не начал матч. Эта страница сама перейдёт к игре, как только он нажмёт «Начать» — ничего обновлять не нужно.</p>
  <div class="spinner" id="spinner"></div>
  <div class="error" id="error" hidden></div>
</main>
<script type="module" src="./lobby-wait.js"></script>
</body>
</html>
